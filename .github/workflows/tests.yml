name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,dist]"
      - name: Build the C++ program
        run: make L=16 QUICK=1 N_SEEDS=2
      - name: Run the tests
        run: pytest -q
